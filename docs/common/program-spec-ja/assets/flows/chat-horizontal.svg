e" marker-end="url(#arrow)"/><rect x="679.0" y="596" width="52" height="20" rx="3" fill="white"/><text x="705" y="610" text-anchor="middle" fill="#344f64" font-size="14" font-family="Yu Gothic,Meiryo,sans-serif">いいえ</text></g><g data-source="E" data-target="N" data-branch=""><path d="M980,306 L1053,306 L1053,966 L1020,966" stroke="#526b80" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/></g><g data-source="M" data-target="N" data-branch=""><path d="M920,807 L920,930" stroke="#526b80" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/></g><g data-source="J" data-target="N" data-branch=""><path d="M630,775 L740,775 L740,880 L850,880 L850,930" stroke="#526b80" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/></g><g data-node="A"><rect x="20" y="55" width="200" height="68" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="120.0" y="94.0">訪問者が質問を送信</tspan></text></g><g data-node="B"><rect x="280" y="55" width="200" height="68" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="380.0" y="84.0">サイト・会話IDを確認し</tspan><tspan x="380.0" y="104.0">、履歴を取得</tspan></text></g><g data-node="C"><rect x="540" y="55" width="200" height="68" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="640.0" y="84.0">承認済みで下書きではな</tspan><tspan x="640.0" y="104.0">い、FAQを検索</tspan></text></g><g data-node="D"><path d="M910.0,40 L1020,90.0 L910.0,140 L800,90.0Z" fill="#f0f7f8" stroke="#62919f" stroke-width="1.5"/><text text-anchor="middle" fill="#233c50" font-size="15.5" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="910.0" y="85.0">1件のFAQに直接一致</tspan><tspan x="910.0" y="105.0">？</tspan></text></g><g data-node="F"><rect x="20" y="260" width="240" height="80" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="140.0" y="295.0">意味の近いFAQを検索、候補</tspan><tspan x="140.0" y="315.0">があればOllamaが選択</tspan></text></g><g data-node="G"><path d="M430.0,250 L535,300.0 L430.0,350 L325,300.0Z" fill="#f0f7f8" stroke="#62919f" stroke-width="1.5"/><text text-anchor="middle" fill="#233c50" font-size="15.5" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="430.0" y="295.0">適切なFAQを選択で</tspan><tspan x="430.0" y="315.0">きた？</tspan></text></g><g data-node="E"><rect x="690" y="270" width="290" height="72" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="835.0" y="301.0">登録済みFAQの回答と、紐付けた画</tspan><tspan x="835.0" y="321.0">像を返す</tspan></text></g><g data-node="H"><rect x="20" y="490" width="235" height="72" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="137.5" y="521.0">関連する承認済みの、資料本</tspan><tspan x="137.5" y="541.0">文を検索</tspan></text></g><g data-node="I"><path d="M417.5,475 L525,525.0 L417.5,575 L310,525.0Z" fill="#f0f7f8" stroke="#62919f" stroke-width="1.5"/><text text-anchor="middle" fill="#233c50" font-size="15.5" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="417.5" y="520.0">根拠となる本文があ</tspan><tspan x="417.5" y="540.0">る？</tspan></text></g><g data-node="K"><rect x="580" y="490" width="230" height="72" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="695.0" y="521.0">資料と会話履歴から、Ollam</tspan><tspan x="695.0" y="541.0">aが回答を作成</tspan></text></g><g data-node="L"><path d="M940.0,475 L1030,525.0 L940.0,575 L850,525.0Z" fill="#f0f7f8" stroke="#62919f" stroke-width="1.5"/><text text-anchor="middle" fill="#233c50" font-size="15.5" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="940.0" y="510.0">回答に根拠があ</tspan><tspan x="940.0" y="530.0">り、処理も成功</tspan><tspan x="940.0" y="550.0">？</tspan></text></g><g data-node="J"><rect x="330" y="735" width="300" height="80" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="480.0" y="770.0">質問の補足または問い合わせを案内</tspan><tspan x="480.0" y="790.0">、AIの障害時はエラーを案内</tspan></text></g><g data-node="M"><rect x="820" y="735" width="200" height="72" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="920.0" y="776.0">AIの回答を返す</tspan></text></g><g data-node="N"><rect x="680" y="930" width="340" height="72" rx="5" fill="#f5f8fb" stroke="#8ba4b8" stroke-width="1.3"/><text text-anchor="middle" fill="#233c50" font-size="16" font-family="Yu Gothic,Meiryo,sans-serif"><tspan x="850.0" y="971.0">結果を保存し、ウィジェットに表示</tspan></text></g></svg>